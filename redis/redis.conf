# Redis Configuration Optimized for Real-Time Message Brokering & Pub/Sub

# Network
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
loglevel notice
databases 16

# Memory & Eviction
maxmemory 256mb
maxmemory-policy volatile-lru

# Pub/Sub Client Output Buffer Limits
# <class> <hard-limit> <soft-limit> <soft-seconds>
# Optimized for high-throughput live WebSocket fan-out
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Persistence (Optional fallback snapshots)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

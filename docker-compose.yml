services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: polling-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongodb-init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - polling_net
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis Message Broker (Pub/Sub & Caching)
  redis:
    image: redis:7.2-alpine
    container_name: polling-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - polling_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 3. Node.js Express API & WebSocket Hub Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polling-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=polling_db
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - JWT_SECRET=pulse-poll-super-secure-jwt-key-for-auth
      - CORS_ORIGIN=*
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polling_net

  # 4. React Frontend (Vite + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polling-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - polling_net

networks:
  polling_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
